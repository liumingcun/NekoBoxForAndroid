name: UI Debug Build
on:
  workflow_dispatch:
  push:
    branches:
      - ui/shadowrocket-style
      - ui/shadowrocket-build
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '^1.25'
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.1' 'ndk;25.0.8775105'
      - name: Build native core and prepare assets
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./run lib core
          ./run init action gradle
      - name: Build debug APK
        run: ./gradlew :app:assembleOssDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: nekobox-ui-debug
          path: app/build/outputs/apk/oss/debug/*.apk
          if-no-files-found: error
